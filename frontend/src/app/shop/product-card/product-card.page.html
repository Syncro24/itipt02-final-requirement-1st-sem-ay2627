<article class="card">
  <a class="card__link">
    <span class="card__art">
      <ion-icon name="hardware-chip-outline" aria-hidden="true"></ion-icon>
    </span>
    <span class="card__name">Sample Product</span>
    <span class="card__meta">In Stock</span>
  </a>
  <div class="card__foot">
    <span class="card__price">$29.99</span>
    <!-- Regular Add Button (Change to uncomment sold-out view) -->
    <ion-button shape="round" aria-label="Add Sample Product to cart">
      <ion-icon slot="icon-only" name="add" aria-hidden="true"></ion-icon>
    </ion-button>
    
    <!-- Alternative Sold-Out State (Uncomment to test sold out view) -->
    <!--
    <span class="card__sold">Sold out</span>
    -->
  </div>
</article>
