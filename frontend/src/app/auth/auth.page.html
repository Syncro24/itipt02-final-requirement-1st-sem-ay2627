<ion-content class="ion-padding" color="light">
  <div class="auth-container">
    <div class="ion-text-center ion-margin-bottom">
      <h2><b>Welcome to ShopApp</b></h2>
      <p>Sign in or create an account to continue</p>
    </div>

    <ion-card class="auth-card">
      <ion-card-content>
        <ion-segment [(ngModel)]="authMode" color="primary" mode="ios" class="ion-margin-bottom">
          <ion-segment-button value="signin">
            <ion-label>Sign In</ion-label>
          </ion-segment-button>
          <ion-segment-button value="signup">
            <ion-label>Sign Up</ion-label>
          </ion-segment-button>
        </ion-segment>

        @if (authMode() === 'signin') {
          <form (ngSubmit)="onLogin()">
            <ion-item fill="solid" class="ion-margin-bottom">
              <ion-input label="Email" labelPlacement="stacked" type="email" autocomplete="email"
                [(ngModel)]="loginData.email" name="email" required></ion-input>
            </ion-item>

            <ion-item fill="solid" class="ion-margin-bottom">
              <ion-input label="Password" labelPlacement="stacked" type="password" autocomplete="current-password"
                [(ngModel)]="loginData.password" name="password" required></ion-input>
            </ion-item>

            <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading()">
              Sign In
            </ion-button>
          </form>
        } @else {
          <form (ngSubmit)="onSignup()">
            <ion-item fill="solid" class="ion-margin-bottom">
              <ion-input label="First Name" labelPlacement="stacked" type="text" autocomplete="given-name"
                [(ngModel)]="signupData.f_name" name="first_name" required></ion-input>
            </ion-item>

            <ion-item fill="solid" class="ion-margin-bottom">
              <ion-input label="Last Name" labelPlacement="stacked" type="text" autocomplete="family-name"
                [(ngModel)]="signupData.l_name" name="last_name" required></ion-input>
            </ion-item>

            <ion-item fill="solid" class="ion-margin-bottom">
              <ion-input label="Email" labelPlacement="stacked" type="email" autocomplete="email"
                [(ngModel)]="signupData.email" name="email" required></ion-input>
            </ion-item>

            <ion-item fill="solid" class="ion-margin-bottom">
              <ion-input label="Password" labelPlacement="stacked" type="password" autocomplete="new-password"
                [(ngModel)]="signupData.password" name="password" required></ion-input>
            </ion-item>

            <ion-button expand="block" type="submit" color="secondary" class="ion-margin-top" [disabled]="loading()">
              Create Account
            </ion-button>
          </form>
        }
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
